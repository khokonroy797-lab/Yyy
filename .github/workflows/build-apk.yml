name: Build & Publish Debug APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build and Package Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java Version
        run: java -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure .env exists
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      - name: Create temporary debug keystore
        run: |
          keytool -genkey -v -keystore ./debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p ~/.android
          cp ./debug.keystore ~/.android/debug.keystore

      - name: Build Debug APK
        id: build_apk
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK v${{ github.run_number }}.${{ github.run_attempt }}"
          gh release create "$TAG_NAME" \
            "app/build/outputs/apk/debug/app-debug.apk" \
            --title "$RELEASE_TITLE" \
            --target "${{ github.sha }}" \
            --notes "Automated debug APK build for testing." \
            --latest

      - name: Report APK download result
        if: always() && steps.build_apk.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="v${{ github.run_number }}.${{ github.run_attempt }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Release publishing succeeded!"
            RELEASE_JSON=$(gh release view "$TAG_NAME" --json tagName,name,url,assets)
            RELEASE_TAG=$(echo "$RELEASE_JSON" | jq -r '.tagName')
            RELEASE_TITLE=$(echo "$RELEASE_JSON" | jq -r '.name')
            RELEASE_URL=$(echo "$RELEASE_JSON" | jq -r '.url')
            ASSET_NAME=$(echo "$RELEASE_JSON" | jq -r '.assets[0].name')

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: $RELEASE_TITLE"
            echo "Release URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_NAME"

            echo "### Release Publishing Succeeded :rocket:" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Tag:** \`$RELEASE_TAG\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Release Title:** $RELEASE_TITLE" >> $GITHUB_STEP_SUMMARY
            echo "- **Direct Release URL:** [View GitHub Release]($RELEASE_URL)" >> $GITHUB_STEP_SUMMARY
            echo "- **APK Asset Filename:** \`$ASSET_NAME\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The APK can be downloaded directly from the release Assets section at: $RELEASE_URL" >> $GITHUB_STEP_SUMMARY
            echo "The normal Actions artifact (\`app-debug-apk\`) is also available as a backup." >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::GitHub Release publishing failed or encountered an error."
            echo "APK build succeeded, and the Actions artifact named app-debug-apk remains available."

            echo "### :warning: Release Publishing Failed" >> $GITHUB_STEP_SUMMARY
            echo "**Note:** The APK build succeeded, but publishing the GitHub Release encountered an issue." >> $GITHUB_STEP_SUMMARY
            echo "The Actions artifact named \`app-debug-apk\` remains available as a backup download from this workflow run." >> $GITHUB_STEP_SUMMARY
          fi
